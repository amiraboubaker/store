# ---------------------------------------------------------------------------
# Nginx reverse proxy for the frontend SPA.
# Domain: @@FRONTEND_DOMAIN@@
# Proxies 443 -> 127.0.0.1:@@FRONTEND_PORT@@
# Install: devops-scripts/nginx/setup-nginx.sh
# ---------------------------------------------------------------------------

# --- HTTP: ACME challenge + redirect to HTTPS -------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name @@FRONTEND_DOMAIN@@ www.@@FRONTEND_DOMAIN@@;

    # Well-known challenge path shared by all server blocks
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://@@FRONTEND_DOMAIN@@$request_uri;
    }
}

# --- www -> non-www redirect (HTTPS) ----------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.@@FRONTEND_DOMAIN@@;

    ssl_certificate     /etc/letsencrypt/live/@@FRONTEND_DOMAIN@@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@@FRONTEND_DOMAIN@@/privkey.pem;
    include              /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam          /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://@@FRONTEND_DOMAIN@@$request_uri;
}

# --- HTTPS: serve the frontend bundle via the container nginx ---------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name @@FRONTEND_DOMAIN@@;

    ssl_certificate     /etc/letsencrypt/live/@@FRONTEND_DOMAIN@@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@@FRONTEND_DOMAIN@@/privkey.pem;
    include              /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam          /etc/letsencrypt/ssl-dhparams.pem;

    # Upload size for contact form attachments etc.
    client_max_body_size 20m;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # Static assets (long cache)
    location /assets/ {
        proxy_pass http://127.0.0.1:@@FRONTEND_PORT@@;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # Everything else -> SPA nginx in the container
    location / {
        proxy_pass http://127.0.0.1:@@FRONTEND_PORT@@;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
}
