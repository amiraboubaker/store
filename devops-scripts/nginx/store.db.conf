# ---------------------------------------------------------------------------
# Nginx reverse proxy for phpMyAdmin.
# Domain: @@DB_DOMAIN@@
# Proxies 443 -> 127.0.0.1:@@PHPADMIN_PORT@@
# Install: devops-scripts/nginx/setup-nginx.sh
# ---------------------------------------------------------------------------

# --- HTTP: ACME challenge + redirect to HTTPS -------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name @@DB_DOMAIN@@;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://@@DB_DOMAIN@@$request_uri;
    }
}

# --- HTTPS: proxy to phpMyAdmin in the container --------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name @@DB_DOMAIN@@;

    ssl_certificate     /etc/letsencrypt/live/@@FRONTEND_DOMAIN@@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@@FRONTEND_DOMAIN@@/privkey.pem;
    include              /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam          /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:@@PHPADMIN_PORT@@;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
}
