# ---------------------------------------------------------------------------
# Nginx reverse proxy for the rayesmodes store.
#
# Frontend:  https://rayesmodes.tn       -> 127.0.0.1:3001
# Backend:   https://api.rayesmodes.tn    -> 127.0.0.1:5000
# DB admin:  https://db.rayesmodes.tn     -> 127.0.0.1:8081
#
# Place this file at /etc/nginx/sites-available/rayesmodes and symlink it
# into /etc/nginx/sites-enabled/. Run certbot afterwards.
# ---------------------------------------------------------------------------

# SSL hardening shared by all three sites
# /etc/nginx/snippets/ssl-params.conf:
#   ssl_protocols TLSv1.2 TLSv1.3;
#   ssl_prefer_server_ciphers on;
#   ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
#   ssl_session_cache shared:le_nginx_SSL:1m;
#   ssl_session_timeout 14h;
#   ssl_session_tickets off;

# === Frontend: rayesmodes.tn ===
server {
    listen 80;
    server_name rayesmodes.tn www.rayesmodes.tn;

    location /.well-known/acme-challenge/ { }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name rayesmodes.tn www.rayesmodes.tn;

    ssl_certificate     /etc/letsencrypt/live/rayesmodes.tn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rayesmodes.tn/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# === Backend API: api.rayesmodes.tn ===
server {
    listen 80;
    server_name api.rayesmodes.tn;

    location /.well-known/acme-challenge/ { }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.rayesmodes.tn;

    ssl_certificate     /etc/letsencrypt/live/api.rayesmodes.tn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.rayesmodes.tn/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# === phpMyAdmin: db.rayesmodes.tn ===
server {
    listen 80;
    server_name db.rayesmodes.tn;

    location /.well-known/acme-challenge/ { }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name db.rayesmodes.tn;

    ssl_certificate     /etc/letsencrypt/live/db.rayesmodes.tn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/db.rayesmodes.tn/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
