# ---------------------------------------------------------------------------
# Production stack for the BACKEND (API + MySQL).
# Run it through ./deploy.sh, not with `docker compose` directly.
#
# Images are BUILT on the VPS from ../../backend/Dockerfile, so the only thing
# the server needs is a clone of this repository and Docker.
# ---------------------------------------------------------------------------

name: ${COMPOSE_PROJECT_NAME:-store-backend}

services:
  mysql:
    image: mysql:8.4
    container_name: ${MYSQL_CONTAINER:-store-mysql}
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # Reverse-DNS lookups can hang on some VPS hosts and stop MySQL ever
      # becoming ready, which shows up as "container is unhealthy".
      - --skip-name-resolve
      # Tuned to boot on small VPS instances. Override MYSQL_TUNING_* in .env
      # if the box has more RAM available.
      - --innodb-buffer-pool-size=${MYSQL_BUFFER_POOL_SIZE:-64M}
      - --innodb-log-buffer-size=8M
      - --key-buffer-size=8M
      - --max-connections=${MYSQL_MAX_CONNECTIONS:-50}
      - --performance-schema=OFF
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required - run ./deploy.sh once to generate .env}
      MYSQL_DATABASE: ${DB_NAME:-store}
      MYSQL_USER: ${DB_USER:-store_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required - run ./deploy.sh once to generate .env}
      TZ: ${TZ:-UTC}
    ports:
      # Bound to loopback by default: never expose MySQL to the public internet.
      - "${DB_BIND_ADDRESS:-127.0.0.1}:${DB_PUBLIC_PORT:-3306}:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ../../backend/sql/create_tables.sql:/docker-entrypoint-initdb.d/01-create_tables.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      # generous: on a small VPS the first boot also runs
      # sql/create_tables.sql, which can take well over a minute
      start_period: 90s
    networks:
      - store-net

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE_NAME:-rayesmodes-backend}:${IMAGE_TAG:-latest}
    container_name: ${BACKEND_CONTAINER:-rayesmodes-backend}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 5000
      TZ: ${TZ:-UTC}
      DB_DIALECT: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-store}
      DB_USER: ${DB_USER:-store_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      # Comma separated list of browser origins allowed to call the API.
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-24h}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}
      PASSWORD_RESET_TOKEN_EXPIRATION: ${PASSWORD_RESET_TOKEN_EXPIRATION:-30m}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME:-Admin}
      ADMIN_LAST_NAME: ${ADMIN_LAST_NAME:-User}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_TO: ${EMAIL_TO:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    ports:
      - "${BACKEND_BIND_ADDRESS:-0.0.0.0}:${BACKEND_PORT:-5000}:5000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - store-net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2
    container_name: ${PHPADMIN_CONTAINER:-store-phpmyadmin}
    restart: unless-stopped
    ports:
      - "${PHPADMIN_BIND_ADDRESS:-0.0.0.0}:${PHPADMIN_PORT:-8081}:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      # Connect as the application user, not root.
      #
      # MySQL applies MYSQL_ROOT_PASSWORD only when the db-data volume is first
      # created. If .env is ever regenerated, DB_ROOT_PASSWORD changes but the
      # volume keeps the old root password, so phpMyAdmin is rejected with
      # "Access denied for user 'root'@'<container-ip>'". DB_USER always matches
      # the credentials the volume was built with, so it cannot drift this way.
      PMA_USER: ${DB_USER:-store_user}
      PMA_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: ${TZ:-UTC}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - store-net

volumes:
  db-data:
    name: ${DB_VOLUME:-store-db-data}

networks:
  store-net:
    external: true
    name: ${STORE_NETWORK:-store-net}
