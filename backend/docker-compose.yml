services:
  backend:
    image: amira100/rayesmodes-back-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 5000
    restart: unless-stopped