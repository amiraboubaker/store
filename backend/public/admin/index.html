<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="login-view" class="login-view">
        <form id="login-form" class="login-card">
            <h1>Admin Login</h1>
            <p class="muted">Restricted area. Admin credentials only.</p>
            <label>Email<input type="email" id="login-email" required autocomplete="username" /></label>
            <label>Password<input type="password" id="login-password" required autocomplete="current-password" /></label>
            <button type="submit">Sign in</button>
            <p id="login-error" class="error" hidden></p>
        </form>
    </div>

    <div id="app-view" class="app-view" hidden>
        <aside class="sidebar">
            <h2>Admin</h2>
            <nav>
                <button data-view="dashboard" class="nav-btn active">Dashboard</button>
                <button data-view="products" class="nav-btn">Products</button>
                <button data-view="orders" class="nav-btn">Orders</button>
                <button data-view="users" class="nav-btn">Users</button>
                <button data-view="activity" class="nav-btn">Activity Log</button>
            </nav>
            <div class="sidebar-footer">
                <span id="admin-email" class="muted"></span>
                <button id="logout-btn" class="link-btn">Log out</button>
            </div>
        </aside>

        <main class="content">
            <!-- Dashboard -->
            <section data-panel="dashboard" class="panel">
                <h1>Dashboard</h1>
                <div id="metric-cards" class="metric-cards"></div>
                <h3>Daily Sales (last 7 days)</h3>
                <table id="daily-sales-table">
                    <thead><tr><th>Date</th><th>Orders</th><th>Revenue</th></tr></thead>
                    <tbody></tbody>
                </table>
            </section>

            <!-- Products -->
            <section data-panel="products" class="panel" hidden>
                <div class="panel-head">
                    <h1>Products</h1>
                    <button id="product-new" class="primary">+ New Product</button>
                </div>
                <table id="products-table">
                    <thead><tr><th>ID</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Actions</th></tr></thead>
                    <tbody></tbody>
                </table>
            </section>

            <!-- Orders -->
            <section data-panel="orders" class="panel" hidden>
                <h1>Orders</h1>
                <table id="orders-table">
                    <thead><tr><th>ID</th><th>Customer</th><th>Total</th><th>Status</th><th>Date</th><th>Actions</th></tr></thead>
                    <tbody></tbody>
                </table>
            </section>

            <!-- Users -->
            <section data-panel="users" class="panel" hidden>
                <h1>Users</h1>
                <table id="users-table">
                    <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Active</th><th>Actions</th></tr></thead>
                    <tbody></tbody>
                </table>
            </section>

            <!-- Activity -->
            <section data-panel="activity" class="panel" hidden>
                <h1>Activity Log</h1>
                <table id="activity-table">
                    <thead><tr><th>Time</th><th>Admin</th><th>Action</th><th>Entity</th><th>ID</th></tr></thead>
                    <tbody></tbody>
                </table>
            </section>
        </main>
    </div>

    <!-- Product modal -->
    <div id="product-modal" class="modal" hidden>
        <div class="modal-card">
            <h2 id="product-modal-title">Product</h2>
            <form id="product-form">
                <input type="hidden" id="product-id" />
                <label>Name<input id="product-name" required /></label>
                <label>Category<input id="product-category" required /></label>
                <label>Material<input id="product-material" /></label>
                <label>Price<input id="product-price" type="number" step="0.01" min="0.01" required /></label>
                <label>Stock<input id="product-stock" type="number" min="0" required /></label>
                <label>Description<textarea id="product-description" required></textarea></label>
                <div class="modal-actions">
                    <button type="submit" class="primary">Save</button>
                    <button type="button" id="product-cancel" class="link-btn">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
